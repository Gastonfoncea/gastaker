<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>gastaker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <!-- ░░ LOGIN ░░ -->
    <main id="login" class="login hidden">
      <form id="login-form" class="login-form" novalidate>
        <h1 class="wordmark">gastaker<span class="caret">_</span></h1>
        <p class="login-sub">Tus gastos, anotados solos.</p>
        <label class="field" style="margin-bottom: 10px">
          <input id="email" type="email" placeholder="Email" autocomplete="username" autofocus />
        </label>
        <label class="field">
          <input
            id="password"
            type="password"
            placeholder="Contraseña"
            autocomplete="current-password"
          />
          <button type="submit" aria-label="Entrar">→</button>
        </label>
        <p id="login-error" class="login-error hidden">Email o clave incorrectos</p>
      </form>
    </main>

    <!-- ░░ APP ░░ -->
    <div id="app" class="app hidden">
      <header class="topbar">
        <div class="wordmark sm">gastaker<span class="caret">_</span></div>
        <nav class="monthnav">
          <button id="prev" class="step" aria-label="Mes anterior">‹</button>
          <span id="month-label" class="month-label">—</span>
          <button id="next" class="step" aria-label="Mes siguiente">›</button>
        </nav>
        <div class="menuwrap">
          <button id="menu-btn" class="step" aria-label="Menú" aria-expanded="false">☰</button>
          <nav id="mainmenu" class="mainmenu hidden">
            <a href="/categorias.html">Categorías</a>
            <a href="/ajustes.html">Ajustes</a>
            <a href="#" id="logout">Salir</a>
          </nav>
        </div>
      </header>

      <!-- resumen del mes (banda full-width) -->
      <section class="summary">
        <span class="overline">Total del mes</span>
        <h2 id="total" class="total">—</h2>
        <div id="total-usd" class="total-usd hidden"></div>
        <div id="total-tarjeta" class="total-tarjeta hidden"></div>
        <div id="bar" class="bar" aria-hidden="true"></div>
        <ul id="legend" class="legend"></ul>
      </section>

      <!-- movimientos (tabla full-width) -->
      <section class="ledger">
        <div class="ledger-head">
          <div class="ledger-head-left">
            <span class="overline">Movimientos</span>
            <span id="movs-count" class="movs-count"></span>
          </div>
          <div class="ledger-head-right">
            <button id="add-btn" class="step" aria-label="Agregar gasto">+</button>
            <select id="cat-filter" class="cat-filter" aria-label="Filtrar por categoría"></select>
          </div>
        </div>
        <div class="table">
          <div class="thead">
            <span>Fecha</span>
            <span>Comercio</span>
            <span>Categoría</span>
            <span class="right">Monto</span>
          </div>
          <div id="ledger" class="ledger-body"></div>
        </div>
        <div id="empty" class="empty hidden">
          <span class="empty-mark">∅</span>
          <p>Sin gastos este mes.<br /><span class="muted">Cuando llegue un mail de Santander, aparece acá.</span></p>
        </div>
      </section>
    </div>

    <!-- popover de categorías (posicionado por JS) -->
    <div id="catmenu" class="catmenu hidden" role="menu"></div>

    <script src="/app.js"></script>
  </body>
</html>
